# GitHub turns off scheduled workflows after 60 days with no repo activity.
# A small monthly commit keeps the hourly sync alive.
name: Heartbeat

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat
          git commit -m "chore: monthly heartbeat"
          git push
