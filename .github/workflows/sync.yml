name: Sync Last.fm

on:
  schedule:
    - cron: "17 * * * *" # every hour at :17 (GitHub runs off-peak minutes more reliably)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/sync
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST "$SYNC_URL" \
            -H "Authorization: Bearer $CRON_SECRET"
